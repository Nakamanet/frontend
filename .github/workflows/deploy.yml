name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/nakamanet/frontend:prod
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.nakamanet.fr/api
            NEXT_PUBLIC_LIB_API_URL=https://adonis.nakamanet.fr
            NEXT_PUBLIC_R2_PUBLIC_URL=https://pub-e672f7689c754d048f17f8bbad20297c.r2.dev
            NEXT_PUBLIC_CHAT_URL=https://adonis.nakamanet.fr

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_DEPLOY_USER }}
          key: ${{ secrets.VPS_DEPLOY_KEY }}
          script: prod frontend
