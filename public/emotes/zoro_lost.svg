<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Zoro Lost / Confused -->
  <circle cx="32" cy="32" r="30" fill="#FAD7A0"/>
  <!-- Green Spiky Hair (Marimo) -->
  <path d="M14 26 L18 12 L26 18 L32 8 L38 18 L46 12 L50 26 Z" fill="#27AE60" stroke="#1E8449" stroke-width="1.5"/>
  <!-- Confused Diagonal Eyebrows -->
  <line x1="20" y1="26" x2="28" y2="28" stroke="#17202A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="36" y1="28" x2="44" y2="25" stroke="#17202A" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left Eye Scar -->
  <line x1="24" y1="30" x2="24" y2="38" stroke="#78281F" stroke-width="2" stroke-linecap="round"/>
  <!-- Open Eye Dot -->
  <circle cx="40" cy="34" r="2.5" fill="#17202A"/>
  <!-- 3 Gold Earrings on Left Ear -->
  <line x1="16" y1="34" x2="16" y2="40" stroke="#F1C40F" stroke-width="2"/>
  <line x1="14" y1="35" x2="14" y2="41" stroke="#F1C40F" stroke-width="2"/>
  <line x1="12" y1="36" x2="12" y2="42" stroke="#F1C40F" stroke-width="2"/>
  <!-- Big Anime Sweatdrop -->
  <path d="M48 20 C48 16, 54 10, 54 10 C54 10, 60 16, 60 20 A6 6 0 0 1 48 20 Z" fill="#5DADE2"/>
  <!-- Squiggly / Lost Mouth -->
  <path d="M26 46 Q30 42 34 46 Q38 50 42 46" stroke="#17202A" stroke-width="2" stroke-linecap="round" fill="none"/>
</svg>
